{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Redline Performance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet"></head><body data-page="login"><div id="nav"></div>
<section class="block" style="padding:60px 0 100px"><div class="container" style="max-width:480px"><div class="panel"><ul class="nav nav-tabs mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Login</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Register</button></li></ul>
<div class="tab-content"><div class="tab-pane fade show active" id="t1"><form id="lf"><div id="le" class="alert alert-danger d-none"></div><input name="email" type="email" class="form-control mb-3" placeholder="Email" required><input name="pw" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-red w-100">Login</button></form></div>
<div class="tab-pane fade" id="t2"><form id="rf"><div id="re" class="alert alert-danger d-none"></div><input name="name" class="form-control mb-3" placeholder="Full name" required><input name="email" type="email" class="form-control mb-3" placeholder="Email" required><input name="pw" type="password" minlength="8" class="form-control mb-3" placeholder="Password (min 8)" required><button class="btn btn-red w-100">Create Account</button></form></div></div></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/app.js' %}"></script></body></html>
