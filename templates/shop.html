{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Redline Performance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet"></head><body data-page="shop"><div id="nav"></div>
<div class="page-head"><div class="container"><h1>Shop</h1></div></div><section class="block" style="padding:60px 0 100px"><div class="container"><div class="row g-5"><aside class="col-lg-3"><div class="panel" id="filters"><h6 class="mb-3">Filters</h6>
<input id="fq" type="text" data-f class="form-control mb-3" placeholder="Name, SKU, brand, category">
<select id="fcat" data-f class="form-select mb-3"></select><select id="fbrand" data-f class="form-select mb-3"></select>
<div class="row g-2 mb-3"><div class="col-6"><input id="fmin" type="number" min="0" data-f class="form-control" placeholder="Min price"></div><div class="col-6"><input id="fmax" type="number" min="0" data-f class="form-control" placeholder="Max price"></div></div>
<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="fdisc" data-f><label class="form-check-label small" for="fdisc">Discounted only</label></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="fstock" data-f><label class="form-check-label small" for="fstock">In stock only</label></div>
<select id="fsort" data-f class="form-select mb-3"><option value="">Default order</option><option value="price">Price: low to high</option><option value="-price">Price: high to low</option><option value="-created_at">Newest</option><option value="created_at">Oldest</option><option value="-views_count">Most viewed</option></select>
<select id="fsize" data-f class="form-select mb-3"><option value="12">12 per page</option><option value="24">24 per page</option><option value="48">48 per page</option></select>
<button id="freset" class="btn btn-ghost w-100">Reset</button></div></aside>
<div class="col-lg-9"><p class="text-mute small" id="cnt"></p><div class="row g-4" id="plist"></div><div class="d-flex justify-content-center gap-2 mt-5 flex-wrap" id="pager"></div></div></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/app.js' %}"></script></body></html>
