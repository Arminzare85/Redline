{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Redline Performance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet"></head><body data-page="checkout"><div id="nav"></div>
<div class="page-head"><div class="container"><h1>Checkout</h1></div></div><section class="block"><div class="container"><form id="cf" class="row g-4"><div class="col-lg-7"><div class="panel"><h5 class="mb-3">Shipping &amp; Payment</h5><div class="row g-3"><div class="col-6"><input class="form-control" placeholder="First name" required></div><div class="col-6"><input class="form-control" placeholder="Last name" required></div><div class="col-12"><input class="form-control" type="email" placeholder="Email" required></div><div class="col-12"><input class="form-control" placeholder="Address" required></div><div class="col-6"><input class="form-control" placeholder="City" required></div><div class="col-6"><input class="form-control" placeholder="Postal code" required></div><div class="col-12"><input class="form-control" placeholder="Card number (demo only)" inputmode="numeric" required></div><div class="col-6"><input class="form-control" placeholder="MM/YY" required></div><div class="col-6"><input class="form-control" placeholder="CVC" required></div></div></div></div><div class="col-lg-5"><div class="panel"><div class="alert alert-secondary small">Demo checkout: orders are saved only in this browser. A backend order endpoint is required for real orders.</div><h5>Order</h5><div id="sum"></div><hr><div class="d-flex justify-content-between price"><span>Total</span><span id="tot"></span></div><button class="btn btn-red w-100 mt-3 py-2">Place Order</button></div></div></form></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/app.js' %}"></script></body></html>
